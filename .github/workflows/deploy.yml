# 自动部署:push 到 main → build → 同步 dist/ 到宝塔服务器
# 需要在 GitHub 仓库 Settings → Secrets and variables → Actions 配置以下 Secrets:
#   SSH_HOST     服务器公网 IP        (如 43.138.10.176)
#   SSH_USER     SSH 用户名           (如 root)
#   SSH_PORT     SSH 端口             (如 22)
#   SSH_PASSWORD 服务器登录密码
name: Deploy

on:
  push:
    branches: [main]
  # 支持手动触发,方便首次测试
  workflow_dispatch:

# 同时只跑一个部署,避免互相覆盖
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 跑单元测试
        run: npm test

      - name: 构建
        run: npm run build

      # 把 dist/ 打成 tar,再 scp + ssh 部署到宝塔服务器
      # 不用 appleboy/scp-action:它会走远程 login shell,宝塔机上的 nvm
      # 会往 stderr 打 "nvm is not compatible with the npm config prefix" 并被当成失败回滚。
      # 这里改用 OpenSSH scp(SFTP 子系统,不跑 bashrc)+ bash --noprofile --norc 执行部署。
      - name: 打包 dist
        run: tar -czf dist.tar.gz -C dist .

      - name: 上传并部署到服务器
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          REMOTE="${SSH_USER}@${SSH_HOST}"
          PORT="${SSH_PORT:-22}"

          echo "Uploading dist.tar.gz ..."
          sshpass -e scp $SSH_OPTS -P "$PORT" dist.tar.gz "$REMOTE:/tmp/cube007-dist.tar.gz"

          echo "Extracting on server ..."
          # --noprofile --norc:跳过 .bashrc / nvm / 宝塔 Node 初始化
          # 跳过 .user.ini:宝塔 open_basedir 文件,常被 chattr +i 锁住,删不掉
          sshpass -e ssh $SSH_OPTS -p "$PORT" "$REMOTE" \
            "bash --noprofile --norc -c '
              set -e
              mkdir -p /www/wwwroot/cube007.cn
              find /www/wwwroot/cube007.cn -mindepth 1 ! -name .user.ini -delete
              tar -xzf /tmp/cube007-dist.tar.gz -C /www/wwwroot/cube007.cn
              rm -f /tmp/cube007-dist.tar.gz
              echo \"Deployed at \$(date)\"
            '"
